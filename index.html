<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>SOLDESP ToolTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // SPA redirect handler for GitHub Pages (only when served under /ToolTrack/)
      var redirect = sessionStorage.getItem('spa-redirect');
      var ghBase = '/ToolTrack/';
      if (redirect && window.location.pathname.startsWith(ghBase)) {
        sessionStorage.removeItem('spa-redirect');
        var currentPath = window.location.pathname.replace(ghBase, '');
        if (redirect !== currentPath) {
          window.history.replaceState(null, null, ghBase + redirect);
        }
      }
    </script>
    <script type="module" src="/src/test_main.tsx"></script>
  </body>
</html>
